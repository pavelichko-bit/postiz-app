name: Debug SSH key

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Test SSH key raw
        env:
          SSH_KEY: ${{ secrets.STAGING_MERGE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/debug_key
          chmod 600 ~/.ssh/debug_key
          ssh-keygen -lf ~/.ssh/debug_key || echo "keygen fingerprint failed"
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "--- ssh -vvv test ---"
          ssh -vvv -o IdentitiesOnly=yes -i ~/.ssh/debug_key -T git@github.com 2>&1 | tail -60
          echo "--- ls-remote test ---"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/debug_key -o IdentitiesOnly=yes" git ls-remote git@github.com:pavelichko-bit/postiz-app.git 2>&1
